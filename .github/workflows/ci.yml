name: CI

on:
  push:
  pull_request:

jobs:
  repo:
    name: repo verification
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup ota
        uses: ota-run/setup@07c9431ae0eee91399f00504dc25d6f13052d617
        with:
          source: contract

      - name: Validate contract
        run: ota validate

      - name: Install dependencies
        run: ota run setup --stream

      - name: Verify
        run: ota run ci --stream

  hosted-runner-smoke:
    name: action smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Create smoke contract
        shell: pwsh
        run: |
          $dir = ".github/fixtures/smoke"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @"
          version: 1
          project:
            name: smoke
            type: application
          agent:
            bootstrap:
              ota:
                sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.20 sh
          tasks:
            noop:
              description: No-op smoke task
              run: echo ready
          "@ | Set-Content -Path "$dir/ota.yaml" -Encoding utf8

      - name: Action smoke test
        uses: ./
        with:
          command: doctor
          path: .
          working-directory: .github/fixtures/smoke
          source: contract
          contract-path: ota.yaml
          annotate: false
          artifact-name: ota-smoke-${{ matrix.os }}

  release:
    name: auto release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - repo
      - hosted-runner-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_version="$(node -p "require('./package.json').version")"
          release_tag="v${release_version}"
          major_tag="v${release_version%%.*}"

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "major_tag=${major_tag}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --refs --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish release
        if: steps.release.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          MAJOR_TAG: ${{ steps.release.outputs.major_tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release_notes_path="$(mktemp)"
          awk '/^## Unreleased/{flag=1; next} /^## /{ if(flag) {exit} } flag {print}' CHANGELOG.md > "$release_notes_path"
          if ! grep -q . "$release_notes_path"; then
            echo "## Release notes" > "$release_notes_path"
            echo "" >> "$release_notes_path"
            echo "Released as ${RELEASE_TAG}." >> "$release_notes_path"
          fi

          git tag "${RELEASE_TAG}" "${HEAD_SHA}"
          git tag -f "${MAJOR_TAG}" "${HEAD_SHA}"
          git push origin "${RELEASE_TAG}"
          git push origin "${MAJOR_TAG}" --force

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --latest --notes-file "$release_notes_path"
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --notes-file "$release_notes_path" \
              --latest
          fi
